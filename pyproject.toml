[project]
name = "yanshu-acps-cluster"
version = "2.0.0"
description = "研枢（Yanshu）：智能体互联的受治资源协作网络——三方整合版（基于 GB/Z 185 与 ACPs）"
requires-python = ">=3.12"
license = { text = "MulanPSL-2.0" }
readme = "README.md"

[tool.pytest.ini_options]
# 集群本体测试 + 队友 guard 组件自带测试（后者经 acps_cluster/covert_event_guard.py
# 兼容 shim 以原模块名导入，队友源码零改动）。
testpaths = ["acps_cluster/tests", "acps_cluster/guard/tests"]
python_files = ["test_*.py"]
addopts = "-ra"
# 说明：干净克隆不携带 dev CA 私钥，签名相关用例会 skip（不是 fail）。
# 需要完整覆盖时按 docs/workspace-partner.md 的流程铸造 dev 身份。

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "acps_cluster/ws-*",
    "partners/wenji",          # 队友仓库（subtree），按上游风格维护，不做本仓 lint
    "partners/designer",       # 队友交付件，保持原样
    "cluster-viz",             # 前端（TS），不归 ruff
]

[tool.ruff.lint]
# 第一阶段只拦"一定错"的规则（语法错误、未定义名、f-string 错误）。
# 全量规则（E/F/BLE/S/ASYNC/RUF100）需要先清理历史 noqa。
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"acps_cluster/tests/*" = ["F401"]
"acps_cluster/guard/tests/*" = ["F401"]
